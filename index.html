<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 12px 8px;
      overscroll-behavior: none;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: #f0f6fc;
    }

    /* Difficulty tabs */
    #difficulty {
      display: flex;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
      width: 100%;
      max-width: 340px;
    }
    #difficulty button {
      flex: 1;
      padding: 7px 0;
      background: #161b22;
      color: #8b949e;
      border: none;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, color 0.15s;
    }
    #difficulty button + button { border-left: 1px solid #30363d; }
    #difficulty button.active { background: #1f6feb; color: #fff; }

    /* Status bar */
    #status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .stat {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 60px;
    }
    .stat:last-child { justify-content: flex-end; }
    #new-game-btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 1.3rem;
      width: 40px;
      height: 40px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s;
    }
    #new-game-btn:active { background: #30363d; }

    /* Board */
    #board-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
      touch-action: none;
    }
    #board {
      display: inline-grid;
      gap: 3px;
      padding: 8px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Cells */
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      font-weight: 800;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s;
      position: relative;
    }
    .cell.closed {
      background: #21262d;
      border: 1px solid #30363d;
    }
    .cell.closed:active { background: #2d333b; }
    .cell.open {
      background: #0d1117;
      border: 1px solid #21262d;
      cursor: default;
    }
    .cell.flagged { background: #21262d; border: 1px solid #30363d; }
    .cell.exploded { background: #da3633 !important; }
    .cell.mine-show { background: #0d1117; border: 1px solid #21262d; }

    /* Number colours */
    .n1 { color: #58a6ff; }
    .n2 { color: #3fb950; }
    .n3 { color: #f85149; }
    .n4 { color: #d2a8ff; }
    .n5 { color: #ffa657; }
    .n6 { color: #39d353; }
    .n7 { color: #ff7b72; }
    .n8 { color: #8b949e; }

    /* Message */
    #message {
      margin-top: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      height: 1.8rem;
      text-align: center;
    }
    #message.won { color: #3fb950; }
    #message.lost { color: #f85149; }

    /* Hint */
    #hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: #484f58;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<h1>💣 Minesweeper</h1>

<div id="difficulty">
  <button onclick="setDifficulty(0)" class="active">Easy</button>
  <button onclick="setDifficulty(1)">Medium</button>
  <button onclick="setDifficulty(2)">Hard</button>
</div>

<div id="status-bar">
  <div class="stat">🚩 <span id="mines-left">0</span></div>
  <button id="new-game-btn" onclick="newGame()" title="New game">🙂</button>
  <div class="stat">⏱ <span id="timer">0</span></div>
</div>

<div id="board-wrap">
  <div id="board"></div>
</div>

<div id="message"></div>

<p id="hint">
  Tap to open &nbsp;·&nbsp; Long-press to flag &nbsp;·&nbsp; Tap number to chord
</p>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const HARDNESS   = [10, 20, 40];
const CONFIGS    = [{w:9,h:14}, {w:13,h:18}, {w:16,h:22}];
const NUM_COLOR  = ['','n1','n2','n3','n4','n5','n6','n7','n8'];

// ─── State ───────────────────────────────────────────────────────────────────
let G = {};           // game state
let difficulty = 0;
let timerHandle = null;
let elapsed = 0;
let longPressHandle = null;
let touchHasMoved = false;

// ─── Game logic ──────────────────────────────────────────────────────────────
function createBoard(w, h, mineCount) {
  const board = Array.from({length: h}, (_, y) =>
    Array.from({length: w}, (_, x) =>
      ({x, y, mine:false, open:false, flagged:false, adj:0})
    )
  );

  // Fisher-Yates mine placement
  const idxs = Array.from({length: w*h}, (_, i) => i);
  for (let i = idxs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  idxs.slice(0, mineCount).forEach(idx => {
    board[Math.floor(idx / w)][idx % w].mine = true;
  });

  // Count adjacencies
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      board[y][x].adj = nbrs(board, board[y][x], w, h).filter(c => c.mine).length;

  return board;
}

function nbrs(board, cell, w, h) {
  const r = [];
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = cell.x+dx, ny = cell.y+dy;
      if (nx >= 0 && nx < w && ny >= 0 && ny < h) r.push(board[ny][nx]);
    }
  return r;
}

function openCell(cell) {
  if (cell.open || cell.flagged || G.over) return false;
  if (!G.started) startTimer();
  cell.open = true;
  G.opened++;
  if (cell.mine) {
    G.over = true;
    G.blowedUp = true;
    G.hitCell = cell;
  } else if (cell.adj === 0) {
    floodFill(cell);
  }
  return true;
}

function toggleFlag(cell) {
  if (cell.open || G.over) return false;
  if (!G.started) startTimer();
  cell.flagged = !cell.flagged;
  G.flags += cell.flagged ? 1 : -1;
  return true;
}

function chord(cell) {
  if (!cell.open || G.over) return false;
  const ns = nbrs(G.board, cell, G.w, G.h);
  if (ns.filter(n => n.flagged).length === cell.adj) {
    floodFill(cell);
    return true;
  }
  return false;
}

function floodFill(cell) {
  const queue = [cell];
  while (queue.length) {
    const cur = queue.shift();
    for (const n of nbrs(G.board, cur, G.w, G.h)) {
      if (n.open || n.flagged) continue;
      n.open = true;
      G.opened++;
      if (n.mine) {
        G.over = true;
        G.blowedUp = true;
        G.hitCell = n;
      } else if (n.adj === 0) {
        queue.push(n);
      }
    }
  }
}

function isWon() {
  return !G.blowedUp && G.w * G.h - G.opened === G.mineCount;
}

// ─── Timer ───────────────────────────────────────────────────────────────────
function startTimer() {
  G.started = true;
  timerHandle = setInterval(() => {
    elapsed++;
    document.getElementById('timer').textContent = elapsed;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerHandle);
  timerHandle = null;
}

// ─── Render ──────────────────────────────────────────────────────────────────
function cellSize() {
  const vw = Math.min(window.innerWidth - 32, 480);
  return Math.max(22, Math.min(38, Math.floor((vw - 16 - (G.w - 1) * 3) / G.w)));
}

function render() {
  const boardEl = document.getElementById('board');
  const sz = cellSize();
  const fs = Math.max(9, sz - 12);
  boardEl.style.gridTemplateColumns = `repeat(${G.w}, ${sz}px)`;

  boardEl.innerHTML = '';
  for (let y = 0; y < G.h; y++) {
    for (let x = 0; x < G.w; x++) {
      const cell = G.board[y][x];
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.cssText = `width:${sz}px;height:${sz}px;font-size:${fs}px`;

      if (cell.open) {
        if (cell.mine) {
          el.classList.add(cell === G.hitCell ? 'exploded' : 'mine-show');
          el.textContent = '💣';
        } else {
          el.classList.add('open');
          if (cell.adj > 0) {
            el.classList.add(NUM_COLOR[cell.adj]);
            el.textContent = cell.adj;
          }
        }
      } else if (G.over && cell.mine && !cell.flagged) {
        el.classList.add('mine-show');
        el.textContent = '💣';
      } else {
        el.classList.add(cell.flagged ? 'flagged' : 'closed');
        el.textContent = cell.flagged ? '🚩' : '';
      }

      attachEvents(el, cell);
      boardEl.appendChild(el);
    }
  }

  document.getElementById('mines-left').textContent = G.mineCount - G.flags;

  const msgEl = document.getElementById('message');
  const btn = document.getElementById('new-game-btn');
  if (isWon()) {
    msgEl.textContent = '🎉 You won!';
    msgEl.className = 'won';
    btn.textContent = '😎';
  } else if (G.blowedUp) {
    msgEl.textContent = '💥 Game over!';
    msgEl.className = 'lost';
    btn.textContent = '😵';
  } else {
    msgEl.textContent = '';
    msgEl.className = '';
  }
}

// ─── Input handling ───────────────────────────────────────────────────────────
function attachEvents(el, cell) {
  // Desktop
  el.addEventListener('click', (e) => { e.preventDefault(); onTap(cell); });
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); onLongPress(cell); });

  // Touch
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchHasMoved = false;
    longPressHandle = setTimeout(() => {
      longPressHandle = null;
      if (!touchHasMoved) onLongPress(cell);
    }, 380);
  }, {passive: false});

  el.addEventListener('touchmove', () => { touchHasMoved = true; }, {passive: true});

  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (longPressHandle !== null) {
      clearTimeout(longPressHandle);
      longPressHandle = null;
      if (!touchHasMoved) onTap(cell);
    }
  }, {passive: false});
}

function onTap(cell) {
  if (G.over) return;
  const changed = cell.open ? chord(cell) : (!cell.flagged && openCell(cell));
  if (changed) afterAction();
}

function onLongPress(cell) {
  if (G.over) return;
  if (toggleFlag(cell)) afterAction();
}

function afterAction() {
  if (isWon() || G.blowedUp) stopTimer();
  render();
}

// ─── Setup ───────────────────────────────────────────────────────────────────
function setDifficulty(d) {
  difficulty = d;
  document.querySelectorAll('#difficulty button').forEach((b, i) =>
    b.classList.toggle('active', i === d)
  );
  newGame();
}

function newGame() {
  stopTimer();
  elapsed = 0;
  document.getElementById('timer').textContent = '0';
  document.getElementById('new-game-btn').textContent = '🙂';

  const {w, h} = CONFIGS[difficulty];
  const mineCount = Math.floor(HARDNESS[difficulty] * w * h / 100);
  G = {
    board: createBoard(w, h, mineCount),
    w, h, mineCount,
    opened: 0, flags: 0,
    blowedUp: false, over: false,
    started: false, hitCell: null,
  };
  render();
}

window.addEventListener('resize', () => render());
newGame();
</script>
</body>
</html>
